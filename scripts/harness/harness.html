<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Pulse harness</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  /* A few of Obsidian's default theme variables, enough for the plugin's styles to resolve. */
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 14px;
    --background-primary: #ffffff; --background-secondary: #f6f6f6; --background-modifier-border: #e3e3e3; --background-modifier-border-hover: #c9c9c9;
    --background-modifier-hover: rgba(0,0,0,.05); --text-normal: #222222; --text-muted: #5c5c5c; --text-faint: #ababab; --interactive-accent: #7c5cff;
    --font-ui-small: 13px; --font-ui-smaller: 12px; --layer-tooltip: 70; --shadow-s: 0 2px 8px rgba(0,0,0,.08);
    background: var(--background-primary); color: var(--text-normal); }
  body.theme-dark { --background-primary: #1e1e1e; --background-secondary: #262626; --background-modifier-border: #363636; --background-modifier-border-hover: #4a4a4a;
    --background-modifier-hover: rgba(255,255,255,.06); --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666666; }
  .shell { display: grid; grid-template-columns: 44px minmax(0, 1fr) 320px; height: calc(100vh - 34px); }
  #ribbon { border-right: 1px solid var(--background-modifier-border); background: var(--background-secondary); padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; }
  #main { overflow: auto; }
  #main > .workspace-leaf-content, #main .view-content { height: 100%; }
  .aside { border-left: 1px solid var(--background-modifier-border); background: var(--background-secondary); overflow: auto; }
  #note { padding: 14px; border-top: 1px solid var(--background-modifier-border); background: var(--background-primary); }
  .block-src { font-size: 11px; color: var(--text-faint); margin: 10px 0 6px; }
  .bar { display: flex; gap: 6px; align-items: center; height: 34px; padding: 0 8px; background: var(--background-secondary); border-top: 1px solid var(--background-modifier-border); font-size: 12px; }
  #statusbar { margin-left: auto; color: var(--text-muted); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--background-modifier-border); background: var(--background-primary); color: var(--text-normal); border-radius: 6px; padding: 4px 10px; }
  button.mod-cta { background: var(--interactive-accent); color: #fff; border-color: transparent; }
  button.mod-warning { color: #d03b3b; }
  button:disabled { opacity: .5; }
  .clickable-icon { border: 0; background: none; padding: 5px; color: var(--text-muted); display: inline-grid; place-items: center; border-radius: 6px; }
  .clickable-icon:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
  input[type=text], select { font: inherit; padding: 5px 8px; border: 1px solid var(--background-modifier-border); border-radius: 6px; background: var(--background-primary); color: var(--text-normal); }
  .modal-container { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
  .modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .modal { position: relative; width: min(640px, 92vw); max-height: 84vh; overflow: auto; background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: 12px; padding: 18px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal.mod-settings { width: min(820px, 94vw); }
  .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
  .modal-button-container { display: flex; justify-content: flex-end; margin-top: 16px; }
  .prompt-input { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
  .suggestion-item { padding: 8px; border-radius: 6px; cursor: pointer; }
  .suggestion-item:hover { background: var(--background-modifier-hover); }
  .suggestion-empty { color: var(--text-faint); padding: 8px; }
  .setting-item { display: flex; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--background-modifier-border); }
  .setting-item-heading { border-top: 0; padding-top: 22px; }
  .setting-item-heading .setting-item-name { font-weight: 700; }
  .setting-item-info { flex: 1; }
  .setting-item-description { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .setting-item-control { display: flex; gap: 6px; align-items: center; }
  .checkbox-container { width: 34px; height: 18px; border-radius: 9px; background: var(--background-modifier-border); position: relative; cursor: pointer; }
  .checkbox-container::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .checkbox-container.is-enabled { background: var(--interactive-accent); }
  .checkbox-container.is-enabled::after { left: 18px; }
  /* ?bare: no harness chrome, page grows to its content (for screenshots). */
  .is-bare .shell { height: auto; grid-template-columns: minmax(0, 1fr) 330px; }
  .is-bare #ribbon, .is-bare .bar, .is-bare #note { display: none; }
  .is-bare #main { overflow: visible; }
  .is-bare.no-side .shell { grid-template-columns: minmax(0, 1fr); }
  .is-bare.no-side .aside { display: none; }
  .is-bare.only-side .shell { grid-template-columns: 360px; }
  .is-bare.only-side #main { display: none; }
  .is-bare.only-side #note { display: block; }
  #notices { position: fixed; top: 12px; right: 12px; z-index: 80; display: grid; gap: 6px; }
  .notice { background: var(--background-secondary); border: 1px solid var(--background-modifier-border); border-radius: 8px; padding: 10px 14px; max-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
</style>
</head>
<body class="theme-light">
<div class="shell">
  <div id="ribbon"></div>
  <div id="main"></div>
  <div class="aside"><div id="side"></div><div id="note"></div></div>
</div>
<div class="bar">
  <button id="theme">Light / dark</button>
  <button id="settings">Settings</button>
  <button data-width="100%">Wide</button><button data-width="720px">720px</button><button data-width="420px">420px</button>
  <button id="reset">Reset data</button>
  <div id="statusbar"></div>
</div>
<div id="notices"></div>
<script type="module" src="../../.harness/boot.js"></script>
</body>
</html>
